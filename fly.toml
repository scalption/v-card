# fly.toml app configuration file generated for scalption-vc on 2026-09-09T10:55:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scalption-vc'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
